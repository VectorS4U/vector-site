# Deploy estático a la rama gh-pages (Pages "Deploy from a branch").
# Evita actions/deploy-pages (API que a veces responde 500).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Con custom domain Pages sirve en raíz → BASE_PATH=/
      # Sin custom domain (…/vector-site/) → BASE_PATH=/vector-site/
      - name: Resolve Pages base
        id: base
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "site_url=https://${CUSTOM_DOMAIN}" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://vectors4u.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/vector-site/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.base.outputs.site_url }}
          BASE_PATH: ${{ steps.base.outputs.base_path }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://app.vector.app' }}

      - name: Write CNAME if custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
