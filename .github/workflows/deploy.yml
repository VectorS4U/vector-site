# Deploy estático a GitHub Pages (Astro → dist/)
# Requisito: Settings → Pages → Source = GitHub Actions
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      # base_path vacío = dominio custom o user site → BASE_PATH=/
      # project site sin custom domain → /vector-site
      - name: Build
        run: |
          echo "origin=${{ steps.pages.outputs.origin }}"
          echo "base_url=${{ steps.pages.outputs.base_url }}"
          echo "base_path=${{ steps.pages.outputs.base_path }}"
          npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://app.vector.app' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
