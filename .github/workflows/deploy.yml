# Publica el site en vector.group4u.net (BASE_PATH=/).
# Dos destinos para que funcione con cualquiera de las configs de Pages:
#   A) Deploy from a branch → gh-pages
#   B) Source → GitHub Actions (deploy-pages)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for custom domain (root paths)
        run: npm run build
        env:
          SITE_URL: https://vector.group4u.net
          BASE_PATH: /
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://app.vector.app' }}

      - name: Verify asset paths are root (not /vector-site/)
        run: |
          if grep -q '/vector-site/' dist/index.html; then
            echo "::error::Build still contains /vector-site/ prefixes"
            grep -o '/vector-site/[^"]*' dist/index.html | head
            exit 1
          fi
          echo "OK: root asset paths"
          grep -o 'href="/_astro/[^"]*"' dist/index.html | head

      - name: Upload Pages artifact (for Source = GitHub Actions)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to gh-pages branch (for Source = Deploy from a branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: vector.group4u.net

  deploy-actions:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Actions source)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
